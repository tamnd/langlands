slug: "reciprocity-function-field-gl"
kind: "theorem"
title: "The Langlands correspondence for GL(n) over function fields"
statement: "Let $F$ be a global function field and $\\ell$ a prime different from its characteristic. There is a bijection between the cuspidal automorphic representations of $GL_n(\\mathbb{A}_F)$ whose central character has finite order and the irreducible continuous representations $G_F \\to GL_n(\\overline{\\mathbb{Q}}_\\ell)$ that are unramified at almost all places and have a determinant of finite order. At each place where both sides are unramified, the Satake parameters are the eigenvalues of Frobenius, and at every place the bijection is compatible with the local Langlands correspondence."
sources: [{"paper": "Laf02", "loc": "Theorem principal"}]
uses: []
lean: {"statement": "Langlands.ReciprocityFunctionFieldGL"}
tier: "T10"
notes: "The Lean statement takes the places of $F$ as the surjective valuations into $\\mathbb{Z}$ with zero, so the places at infinity are included without a choice of model, and the adele ring as the restricted product of the completions. The automorphic side is the set of classes of cusp eigenforms, with two forms equivalent when their Hecke eigenvalues agree at almost all places, which by strong multiplicity one are the cuspidal automorphic representations. The matching is stated at the unramified places only, with the Satake polynomial equal to the characteristic polynomial of an arithmetic Frobenius. The compatibility with the local correspondence at the ramified places is left out. The principal adeles are the constant adeles, because the fact that an element of $F$ is integral at almost all places is not in Mathlib yet. The theorem is due to Drinfeld for $n = 2$ and to L. Lafforgue in general."
