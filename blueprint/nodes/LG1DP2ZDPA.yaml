tier: "T4"
notes: "The Lean statement is an implication from the node LGV8B6TVWZ (RamanujanPeterssonHolomorphic), so its proof does not use a proof of that node. This is the bridge of spec 06.4 for RamanujanTau. The assumption is the hypothesis DeltaIsEigenform of the Lean statement, a theorem of Mordell and Hecke that Mathlib does not have yet."
