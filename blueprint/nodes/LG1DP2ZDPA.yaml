slug: "fc-ramanujan-tau-bridge"
kind: "theorem"
title: "The Ramanujan bound for tau follows from the project statement"
statement: "Assume that $\\Delta = q \\prod_{n \\ge 1} (1 - q^n)^{24}$ is the $q$-expansion of a normalized Hecke eigenform of weight 12 and level 1. Then the Ramanujan-Petersson bound for holomorphic eigenforms implies $|\\tau(p)| \\le 2 p^{11/2}$ for each prime $p$."
