slug: "local-langlands-gsp4"
kind: "theorem"
title: "The local Langlands correspondence for GSp(4)"
statement: "Let $K$ be a nonarchimedean local field of characteristic zero. There is a surjective finite-to-one map from the irreducible smooth representations of $GSp_4(K)$ to the L-parameters $W_K \\times SL_2(\\mathbb{C}) \\to GSp_4(\\mathbb{C})$. The fiber over a parameter $\\varphi$ is in bijection with the irreducible characters of its component group. The map takes the central character to the similitude character of the parameter, and for a generic representation it preserves the $\\gamma$-factors of pairs with the generic representations of $GL_r(K)$, $r \\le 2$."
sources: [{"paper": "GT11", "loc": "Main Theorem"}]
uses: []
lean: {"statement": "Langlands.LocalLanglandsGSp4"}
tier: "T5"
notes: "The Lean statement takes $GSp_4$ as a concrete matrix group and the L-parameters as Weil-Deligne representations into $GSp_4(\\mathbb{C})$ up to conjugation. It asks for a surjection with finite fibers that matches the central character with the similitude character, respects twists, sends the constituents of each principal series to the diagonal parameter, sends the supercuspidals to discrete parameters, and gives each discrete packet the size of the component group with exactly one generic member. The factors of pairs with $GL_1$ and $GL_2$ that make the map unique are left out, so the statement asserts existence only. The bijection of a packet with the characters of the component group is also left out."
