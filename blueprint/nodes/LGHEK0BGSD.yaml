slug: "finite-abelian-local-reciprocity"
kind: "theorem"
title: "Finite abelian local reciprocity"
statement: "For a finite abelian extension $L/K$ of a nonarchimedean local field there is a continuous surjective homomorphism $K^\\times \\to \\mathrm{Gal}(L/K)$ whose kernel is the norm group $N_{L/K}(L^\\times)$."
sources: [{"paper": "Ser67", "loc": "Chapter VI, Section 2"}, {"paper": "Mil20", "loc": "Chapter III"}]
