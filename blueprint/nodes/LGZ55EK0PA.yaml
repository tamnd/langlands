title: "Modularity of semistable elliptic curves over Q"
statement: "For each semistable elliptic curve $E$ over $\\mathbb{Q}$ there is a cusp form $f$ of weight 2 on $\\Gamma_0(N)$ with $a_n(f) = a_n(E)$ for each $n \\ge 1$."
sources: [{"paper": "Wil95", "loc": "Theorem 0.4"}]
