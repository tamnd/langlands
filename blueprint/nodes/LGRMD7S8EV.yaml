tag: "LGRMD7S8EV"
slug: "breuil-mezard-gl2-qp"
kind: "theorem"
title: "The Breuil-Mezard conjecture for GL(2) over Q_p"
statement: "Let $p > 2$, let $k$ be a finite field of characteristic $p$, and let $\\bar\\rho : G_{\\mathbb{Q}_p} \\to GL_2(k)$ be continuous. For each Hodge-Tate type $\\lambda$ and each inertial type $\\tau$, the Hilbert-Samuel multiplicity of the special fiber of the potentially semistable framed deformation ring $R^\\square(\\lambda, \\tau, \\bar\\rho)$ is $\\sum_{a, b} n_{a, b}(\\lambda, \\tau) \\mu_{a, b}(\\bar\\rho)$. Here $n_{a, b}$ is the multiplicity of the Serre weight $\\mathrm{Sym}^a k^2 \\otimes \\det^b$ in the reduction of the representation $\\sigma(\\lambda, \\tau)$ of $GL_2(\\mathbb{Z}_p)$, and the integers $\\mu_{a, b}(\\bar\\rho)$ depend only on $\\bar\\rho$ and the weight."
tier: "T9"
notes: "This node has no Lean statement yet. Langlands-lean has the Serre weights (Langlands.serreWeight) and the framed lifts (Langlands.FramedLift). The statement also needs the universal framed deformation ring, Hilbert-Samuel multiplicities, potentially semistable representations, inertial types and the types of Henniart, and Mathlib has none of them. It is a theorem of Kisin, Paskunas, Hu and Tan for $p > 2$ in most cases, the corpus rows T9-20 and T8-08."
