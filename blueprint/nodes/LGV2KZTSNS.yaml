tag: "LGV2KZTSNS"
slug: "automorphic-to-galois"
kind: "theorem"
title: "Galois representations of regular algebraic cuspidal representations"
statement: "Let $K$ be a CM field and $\\pi$ a regular algebraic cuspidal automorphic representation of $GL_n(\\mathbb{A}_K)$. For each prime $\\ell$ and each $\\iota : \\overline{\\mathbb{Q}}_\\ell \\cong \\mathbb{C}$ there is a continuous semisimple representation $\\rho_{\\pi, \\iota} : G_K \\to GL_n(\\overline{\\mathbb{Q}}_\\ell)$ with this property. At each finite place $v \\nmid \\ell$ where $\\pi$ and $K$ are unramified, $\\rho_{\\pi, \\iota}$ is unramified and the eigenvalues of $\\rho_{\\pi, \\iota}(\\mathrm{Frob}_v)$ correspond under $\\iota$ to the Satake parameters of $\\pi_v$."
sources: [{"paper": "HLTT16", "loc": "Theorem A"}, {"paper": "Sch15", "loc": "Theorem V.4.1"}]
uses: []
lean: {"statement": "Langlands.AutomorphicToGalois"}
tier: "T8"
notes: "The Lean statement is for $K$ totally real or CM. Regular algebraic means that the Capelli operator acts at each infinite place by distinct integer roots. For each $\\ell$ and $\\iota$ it asks for a continuous representation that is unramified at almost all places and matches the Hecke polynomial at almost all places. The exact set of unramified places and the local-global compatibility are left out."
