slug: "weil-group-dense"
kind: "theorem"
title: "The Weil group is dense in the absolute Galois group"
statement: "The image of $W_K$ in $G_K$ is dense. The map $G_K \\to \\mathrm{Gal}(\\bar k / k)$ is continuous, surjective and open, and $W_K$ is the preimage of the subgroup generated by the Frobenius, which is dense."
sources: [{"paper": "Tat79", "loc": "Section 1.4"}]
uses: ["LGBPNG162F"]
lean: {"statement": "Langlands.WeilGroup.denseRange_toGalois", "proof": "Langlands.WeilGroup.denseRange_toGalois"}
tier: "T3"
notes: "The proof also shows that $G_K$ is compact in each characteristic, through the separable closure, and that the integral closure of $\\mathcal{O}_K$ in $\\bar K$ is a local ring, through the spectral norm."
