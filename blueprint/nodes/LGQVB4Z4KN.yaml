title: "Geometric Frobenius elements"
statement: "An element of $W_K$ is a geometric Frobenius if it acts on $\\overline{k}$ as $x \\mapsto x^{1/q}$, the inverse of the arithmetic Frobenius."
sources: [{"paper": "Tat79", "loc": "Section 1.4.1"}]
uses: ["LGBPNG162F"]
