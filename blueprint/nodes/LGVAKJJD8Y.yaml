tag: "LGVAKJJD8Y"
slug: "global-reciprocity"
kind: "theorem"
title: "Global reciprocity"
statement: "For each finite abelian extension $L$ of a number field $K$ there is a homomorphism from the idele class group of $K$ to $\\mathrm{Gal}(L/K)$ that is trivial on the image of $K^\\times$ and that maps a uniformizer at each unramified place to the inverse of the arithmetic Frobenius."
sources: [{"paper": "Mil20", "loc": "Chapter V"}]
uses: ["LGAV7YV6K6"]
lean: {"statement": "Langlands.GlobalReciprocity", "proof": "Langlands.Bridge.globalReciprocity"}
tier: "T3"
notes: "The proof is the port of n-yamaguchi-0729/ClassFieldTheory in Langlands/Ported/NYLL. The Artin map is the geometric global norm residue map of the port, which sends a uniformizer at an unramified place to the geometric Frobenius."
