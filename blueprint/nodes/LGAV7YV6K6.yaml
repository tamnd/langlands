tag: "LGAV7YV6K6"
slug: "local-reciprocity-gl1"
kind: "theorem"
title: "Local class field theory as the Langlands correspondence for GL(1)"
statement: "For a nonarchimedean local field $K$ there is a unique topological isomorphism $K^\\times \\cong W_K^{ab}$ that maps each uniformizer to the class of a geometric Frobenius and that induces, for each finite abelian extension $L/K$, a surjection onto $\\mathrm{Gal}(L/K)$ with kernel $N_{L/K}(L^\\times)$."
sources: [{"paper": "Ser67", "loc": "Chapter VI, Theorem 2"}, {"paper": "Mil20", "loc": "Chapter I, Theorem 1.1"}, {"paper": "Tat79", "loc": "Section 1.4"}]
uses: ["LGBPNG162F", "LGQVB4Z4KN", "LGVSG50K41", "LGHEK0BGSD"]
lean: {"statement": "Langlands.LocalReciprocityGL1", "proof": "Langlands.localReciprocityGL1"}
tier: "T3"
notes: "The proof in langlands-lean has two parts. The existence composes the absolute local Artin map of the port of n-yamaguchi-0729/ClassFieldTheory with the inverse of the injection of the abelianized Weil group into the abelianized Galois group. The uniqueness uses the uniqueness of coherent families of finite Artin maps in the port."
