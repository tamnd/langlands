tag: "LGRYCDD49K"
slug: "reciprocity-gl"
kind: "conjecture"
title: "The reciprocity conjecture for GL(n)"
statement: "Let $K$ be a number field, $\\ell$ a prime and $\\iota : \\overline{\\mathbb{Q}}_\\ell \\cong \\mathbb{C}$. There is a bijection between the cuspidal algebraic automorphic representations $\\pi$ of $GL_n(\\mathbb{A}_K)$ and the irreducible continuous representations $\\rho : G_K \\to GL_n(\\overline{\\mathbb{Q}}_\\ell)$ that are unramified at almost all places and de Rham at the places over $\\ell$. At almost all places $v$, the Satake parameters of $\\pi_v$, with the normalization of Clozel, are the images under $\\iota$ of the eigenvalues of $\\rho(\\mathrm{Frob}_v)$."
uses: []
lean: {"statement": "Langlands.ReciprocityGL"}
tier: "T8"
notes: "This is open. The Lean statement defines the algebraic cusp forms of Clozel through the action of the Capelli operator at the infinite places. Mathlib has no de Rham condition, and without it the bijection is false already for $n = 1$. So the Lean statement is a weak form: each algebraic cuspidal class has an irreducible $\\ell$-adic representation that matches it at almost all places, the map is injective, and each representation with finite image is in its image. The weak form follows from the conjecture and contains the strong Artin conjecture. The conjecture is due to Clozel (1990) and to Fontaine and Mazur, which are not rows of the corpus, so the node cites no paper record."
